<ion-content [fullscreen]="true" class="ion-padding auth-content">
  <!-- Looping Background Video -->
  <video autoplay loop muted playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.3) contrast(1.1) saturate(0.7);">
      <source src="assets/videos/cctv-surveillance.mp4" type="video/mp4">
  </video>

  <!-- CCTV HUD & Scanlines -->
  <div class="cctv-scanlines"></div>
  
  <div class="cctv-hud" style="position: absolute; top: 20px; left: 20px; color: #10b981; font-family: monospace; font-size: 11px; z-index: 2; font-weight: bold; text-shadow: 0 0 4px rgba(16,185,129,0.5); display: flex; align-items: center; gap: 4px;">
      <span class="rec-dot"></span> REC [CAM 02]
  </div>

  <div class="cctv-hud" style="position: absolute; top: 20px; right: 20px; color: #10b981; font-family: monospace; font-size: 11px; z-index: 2; font-weight: bold; text-shadow: 0 0 4px rgba(16,185,129,0.5);">
      SECURE LINK AUTHORIZED
  </div>

  <div class="auth-wrapper">
    <div class="auth-card animate-fade-in">
      <div class="auth-header">
        <h1 style="color: white; font-weight: 800; letter-spacing: -0.02em;">Join SmartPark</h1>
        <p style="color: #94a3b8;">Register your account and vehicle</p>
      </div>

      <!-- Error Alert Box -->
      <div class="error-msg" *ngIf="error">
        {{ error }}
      </div>

      <ion-list lines="none" style="background: transparent;">
        <ion-item class="auth-item">
          <ion-label position="stacked">Full Name</ion-label>
          <ion-input type="text" [(ngModel)]="name" placeholder="John Doe" class="modern-input"></ion-input>
        </ion-item>

        <ion-item class="auth-item">
          <ion-label position="stacked">APU Email Address</ion-label>
          <ion-input type="email" [(ngModel)]="email" placeholder="TP067847@mail.apu.edu.my" class="modern-input"></ion-input>
        </ion-item>
        <p style="font-size: 0.72rem; color: #94a3b8; margin: 2px 0 8px 4px; font-weight: 500;">
          Use official <strong>TPXXXXXX&#64;mail.apu.edu.my</strong> or staff email.
        </p>

        <ion-item class="auth-item">
          <ion-label position="stacked">Password</ion-label>
          <ion-input type="password" [(ngModel)]="password" placeholder="••••••••" class="modern-input"></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" shape="round" class="auth-btn" (click)="handleSignup()" [disabled]="loading">
        {{ loading ? 'Creating Secure Account...' : 'Register Secure Profile' }}
      </ion-button>

      <div class="auth-footer" style="color: #94a3b8;">
        Already registered? <span class="link" routerLink="/login" style="color: #3b82f6;">Sign in</span>
      </div>
    </div>
  </div>
</ion-content>
